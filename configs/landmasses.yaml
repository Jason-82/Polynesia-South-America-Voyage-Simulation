# The land in the study domain: island groups, coast segments, regions and
# sighting heights. Read by voyage_sim.catalog.build_catalog(), which builds
# the shorelines from GSHHG 2.3.7 (full resolution, level 1) when downloaded,
# and otherwise a placeholder (named islands as circles, the coast from a
# coarse polyline) for synthetic runs and tests.
#
# Coordinates are [lon, lat] in degrees (lon east, lat north). Heights are the
# effective sighting height in m: the highest point, counting the trees on
# atolls. Distances are km.
#
# Schema
# ------
# domain: [lon_min, lon_max, lat_min, lat_max]   # polygons whose centroid lies outside are dropped
# merge_km: 3          # polygons of one pool whose shorelines come this close merge into one landmass
#                      # (the motu of an atoll); a group may override it (default 3)
# match_km: 20         # a named island matches the landmass containing its ref, else the nearest
#                      # within this distance; failing that, its placeholder circle is used (default 20)
# continent_min_area_km2: 1.0e+6  # GSHHG polygons at least this large are continents (default 1e6)
# drop_ids: [56711]   # GSHHG polygons (the shapefile's id field) to leave out (default none)
# pacific_mask: [[lon, lat], ...] # polygon (closed automatically): continental shoreline inside it is the
#                      # Pacific coast; islands outside it and outside every group box are dropped
#
# groups:              # ocean island groups; a polygon belongs to the first group whose box holds its centroid
#   - name: South Marquesas
#     region: polynesia          # polynesia | americas | americas_other | offshore | other
#     kind: island               # island | atoll: kind of the group's unnamed landmasses (default island)
#     height_m: 50               # height of the group's unnamed landmasses
#     source: "..."              # citation or reasoning for that default
#     merge_km: 1.0              # optional override of merge_km
#     boxes: [[lon_min, lon_max, lat_min, lat_max], ...]
#     islands:                   # named islands
#       - name: Fatu Hiva
#         ref: [lon, lat]        # reference position: the island's land centroid unless ref_type: peak
#         ref_type: centroid     # centroid | peak (default centroid; a peak cannot be shifted to)
#         height_m: 960
#         radius_km: 6           # placeholder circle (no GSHHG, or no polygon matched)
#         kind: island           # optional, default the group's kind (high islands of atoll groups say island)
#         shift_to_ref: false    # move the matched shoreline so its centroid sits on ref (default false)
#         source: "..."
#
# coast:
#   piece_deg: 0.1               # latitude band of one coast piece (default 0.1)
#   relief_csv: coast_relief.csv # per-band relief, relative to this file; rows are piece_deg bands
#   relief_column: max5          # which column is the piece height (default max5: highest within 5 km)
#   relief_source: "..."
#   islet_drop_km: 15            # an island lying wholly this close to the continental coast is dropped
#   island_join_km: 150          # other islands with a shoreline point this close join the coast segment
#                                # at their centroid's latitude; farther ones are dropped (default 150)
#   island_height_m: 50          # height of unnamed coastal islands (default 50)
#   island_source: "..."
#   segments:                    # north to south, not overlapping; pieces between segments are dropped
#     - {name: "Coast: Ecuador", region: americas, north: 1.43, south: -3.39,
#        height_m: 230, source: "..."}   # height_m: for bands without relief data (optional if none lack it)
#   islands: [...]               # named coastal islands, as in groups (their group is the segment)
#   placeholder: [[[lon, lat], ...], ...]   # coast polylines used without GSHHG
#
# Values marked "approximate, to verify" are best knowledge, not checked
# against a DEM or a primary source; PROVISIONAL values await data.
#
# Reference positions marked (fact-check) are land centroids from the
# Copernicus DEM. build_catalog() reports each named island's offset from its
# GSHHG 2.3.7 shoreline in Catalog.named; islands whose GSHHG shoreline is
# displaced by more than 1 km as a whole (centroid and extent agree) carry
# shift_to_ref, with the offset found noted beside them. Offsets of 1-2 km
# that come from a different outline rather than a displacement (Mangareva,
# Maui, the atolls, the approximate references) are left alone.

domain: [-165.0, -65.0, -50.0, 30.0]
merge_km: 3.0
match_km: 20.0
continent_min_area_km2: 1.0e+6

# GSHHG holds a few islands twice, once from WVS and once from WDBII (CIA World
# Data Bank II), at different places. The Copernicus DEM has no land under the
# copies dropped here, which would otherwise be phantom islets.
drop_ids:
  - 56711   # Sala y Gómez (WVS, 0.2 km2), 19 km WNW of the island; the WDBII copy, 10 km W, is kept and shifted
  - 13983   # San Félix (WDBII), 4 km N of the island
  - 12999   # Santa Clara (WDBII), 5 km W of the WVS copy, which lies where the DEM has the island

# Roughly the continental divide of the Americas from 31N to 51S, closed far out
# in the Pacific. Its course only matters where Pacific and Atlantic shores are
# close: across Mexico, Central America (GSHHG splits the Americas along the
# Panama Canal, so the mask crosses the isthmus at the canal's Pacific
# entrance) and NW Colombia (the Gulf of Urabá is Caribbean).
